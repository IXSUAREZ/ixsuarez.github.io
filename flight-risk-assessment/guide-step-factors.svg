<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <!-- Step 2-3: three stacked toggle rows — ON teal, ON hazard red tint, OFF — with point badges -->
  <rect width="800" height="600" fill="#FFFFFF"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Row 1: ON, teal (mitigator) -->
    <rect x="110" y="120" width="580" height="96" rx="12" fill="#E2F1E7" fill-opacity="0.55" stroke="#C9CFC8" stroke-width="2"/>
    <rect x="110" y="120" width="4" height="96" rx="2" fill="#2F8F5B"/>
    <rect x="142" y="154" width="56" height="30" rx="15" fill="#2F8F5B"/>
    <circle cx="183" cy="169" r="12" fill="#FFFFFF"/>
    <g stroke="#54666E" stroke-width="8">
      <line x1="228" y1="158" x2="470" y2="158"/>
    </g>
    <g stroke="#A8B2B6" stroke-width="6">
      <line x1="228" y1="184" x2="410" y2="184"/>
    </g>
    <rect x="596" y="152" width="64" height="34" rx="8" fill="#E2F1E7"/>
    <text x="628" y="176" font-family="monospace" font-size="20" font-weight="600" fill="#216B44" text-anchor="middle">−2</text>

    <!-- Row 2: ON, hazard red tint -->
    <rect x="110" y="252" width="580" height="96" rx="12" fill="#F7E2DE" fill-opacity="0.55" stroke="#C9CFC8" stroke-width="2"/>
    <rect x="110" y="252" width="4" height="96" rx="2" fill="#C0463B"/>
    <rect x="142" y="286" width="56" height="30" rx="15" fill="#C0463B"/>
    <circle cx="183" cy="301" r="12" fill="#FFFFFF"/>
    <g stroke="#54666E" stroke-width="8">
      <line x1="228" y1="290" x2="500" y2="290"/>
    </g>
    <g stroke="#A8B2B6" stroke-width="6">
      <line x1="228" y1="316" x2="392" y2="316"/>
    </g>
    <rect x="596" y="284" width="64" height="34" rx="8" fill="#F7E2DE"/>
    <text x="628" y="308" font-family="monospace" font-size="20" font-weight="600" fill="#93322B" text-anchor="middle">+3</text>

    <!-- Row 3: OFF -->
    <rect x="110" y="384" width="580" height="96" rx="12" fill="#FFFFFF" stroke="#C9CFC8" stroke-width="2"/>
    <rect x="142" y="418" width="56" height="30" rx="15" fill="#EFEFEC" stroke="#C9CFC8" stroke-width="2"/>
    <circle cx="157" cy="433" r="12" fill="#A8B2B6"/>
    <g stroke="#54666E" stroke-width="8">
      <line x1="228" y1="422" x2="452" y2="422"/>
    </g>
    <g stroke="#A8B2B6" stroke-width="6">
      <line x1="228" y1="448" x2="372" y2="448"/>
    </g>
    <rect x="596" y="416" width="64" height="34" rx="8" fill="#EFEFEC"/>
    <text x="628" y="440" font-family="monospace" font-size="20" font-weight="600" fill="#7C8A90" text-anchor="middle">+2</text>
  </g>
</svg>
